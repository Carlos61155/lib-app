
services:
  postgres:
    image: postgres:17
    container_name: lib-app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lib_app
      POSTGRES_USER: lib_app_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lib_app_user -d lib_app"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
